version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      workflow-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      console-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # TypeScript 7 is outside typescript-eslint's supported <6.1 peer range.
    # Keep the latest compatible TypeScript 6 release until that constraint moves.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Go release-line upgrades are coordinated with the Gentoo executor image.
    # Dependabot still proposes patch releases (including security fixes), but
    # must not replace a stable toolchain with a release candidate.
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
