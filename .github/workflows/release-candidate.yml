name: Release candidate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_id:
        description: SemVer release ID, including the v prefix
        required: true
        type: string
      source_commit:
        description: Full 40-character commit on the default branch
        required: true
        type: string
      confirm:
        description: Explicit candidate publication confirmation
        required: true
        type: choice
        options:
          - publish-candidate

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}-${{ inputs.release_id || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate trusted release input
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.gate.outputs.release_id }}
      source_commit: ${{ steps.gate.outputs.source_commit }}
      source_ref: ${{ steps.gate.outputs.source_ref }}
      candidate_tag: ${{ steps.gate.outputs.candidate_tag }}
      signing_identity: ${{ steps.gate.outputs.signing_identity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed unless the source is trusted and immutable
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          REQUESTED_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if [ "${EVENT_NAME}" = "push" ]; then
            release_id="${GITHUB_REF_NAME}"
            source_ref="${GITHUB_REF}"
            if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]; then
              echo "release tags must be annotated; lightweight tags are not trusted" >&2
              exit 1
            fi
            source_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ] || [ "${REQUESTED_CONFIRM}" != "publish-candidate" ]; then
              echo "manual publication must run the default-branch workflow with explicit confirmation" >&2
              exit 1
            fi
            release_id="${REQUESTED_RELEASE_ID}"
            source_ref="refs/heads/${DEFAULT_BRANCH}"
            source_commit="${REQUESTED_SOURCE_COMMIT}"
            if ! [[ "${source_commit}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_commit must be a full lowercase commit SHA" >&2
              exit 1
            fi
            git cat-file -e "${source_commit}^{commit}"
          else
            echo "unsupported release event" >&2
            exit 1
          fi
          if ! [[ "${release_id}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "release ID must be an explicit SemVer-style v tag" >&2
            exit 1
          fi
          if [ "${#release_id}" -gt 64 ]; then
            echo "release ID exceeds the 64-character contract limit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${source_commit}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "release source commit is not reachable from the default branch" >&2
            exit 1
          fi
          short_commit="${source_commit:0:12}"
          candidate_tag="candidate-${release_id}-g${short_commit}-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          signing_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml@${GITHUB_REF}"
          {
            echo "release_id=${release_id}"
            echo "source_commit=${source_commit}"
            echo "source_ref=${source_ref}"
            echo "candidate_tag=${candidate_tag}"
            echo "signing_identity=${signing_identity}"
          } >>"${GITHUB_OUTPUT}"

  binaries:
    name: Build release binaries
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build the reviewed command and platform matrix
        env:
          RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          SOURCE_COMMIT: ${{ needs.gate.outputs.source_commit }}
        run: |
          set -euo pipefail
          mkdir -p bundle/binaries
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          while IFS=$'\t' read -r os arch; do
            while IFS= read -r command; do
              output="bundle/binaries/portage-${command}-${os}-${arch}"
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
                -ldflags "-X main.version=${RELEASE_ID} -X main.commit=${SOURCE_COMMIT} -X main.buildTime=${build_time}" \
                -o "${output}" "./cmd/${command}"
            done < <(jq -r '.commands[]' release/release-config.json)
          done < <(jq -r '.binary_platforms[] | [.os, .arch] | @tsv' release/release-config.json)
          (
            cd bundle
            find binaries -type f -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-binaries-${{ needs.gate.outputs.candidate_tag }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30

  images:
    name: Build, attest, and sign role images
    needs: gate
    runs-on: ubuntu-24.04
    environment: release-candidate
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.5

      - name: Push digest-authoritative multi-arch images
        env:
          CANDIDATE_TAG: ${{ needs.gate.outputs.candidate_tag }}
          RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          SOURCE_COMMIT: ${{ needs.gate.outputs.source_commit }}
          SOURCE_REF: ${{ needs.gate.outputs.source_ref }}
          SIGNING_IDENTITY: ${{ needs.gate.outputs.signing_identity }}
        run: |
          set -euo pipefail
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          platforms="$(jq -r '.platforms | join(",")' release/release-config.json)"
          mkdir -p bundle/evidence metadata
          : >images.ndjson
          while IFS=$'\t' read -r role target; do
            repository="${namespace}/${role}"
            tagged_reference="${repository}:${CANDIDATE_TAG}"
            metadata_file="metadata/${role}.json"
            docker buildx build \
              --platform "${platforms}" \
              --target "${target}" \
              --label "org.opencontainers.image.created=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              --label "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${RELEASE_ID}" \
              --attest "type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68" \
              --provenance=mode=max \
              --metadata-file "${metadata_file}" \
              --tag "${tagged_reference}" \
              --push .
            image_digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${metadata_file}")"
            immutable_reference="${repository}@${image_digest}"
            sbom_path="bundle/evidence/${role}.sbom.spdx.json"
            provenance_path="bundle/evidence/${role}.provenance.slsa.json"
            docker buildx imagetools inspect "${immutable_reference}" --format '{{json .SBOM}}' | jq -S . >"${sbom_path}"
            docker buildx imagetools inspect "${immutable_reference}" --format '{{json .Provenance}}' | jq -S . >"${provenance_path}"
            jq -e '[.. | objects | .spdxVersion? | select(.)] | length > 0' "${sbom_path}" >/dev/null
            jq -e '[.. | objects | .buildType? | select(.)] | length > 0' "${provenance_path}" >/dev/null
            cosign sign --yes "${immutable_reference}"
            cosign verify \
              --certificate-identity "${SIGNING_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${immutable_reference}" >/dev/null
            jq -n \
              --arg role "${role}" \
              --arg target "${target}" \
              --arg repository "${repository}" \
              --arg digest "${image_digest}" \
              --arg reference "${immutable_reference}" \
              --arg sbom_path "evidence/${role}.sbom.spdx.json" \
              --arg sbom_sha256 "sha256:$(sha256sum "${sbom_path}" | cut -d' ' -f1)" \
              --arg provenance_path "evidence/${role}.provenance.slsa.json" \
              --arg provenance_sha256 "sha256:$(sha256sum "${provenance_path}" | cut -d' ' -f1)" \
              --argjson platforms "$(jq '.platforms' release/release-config.json)" \
              '{role:$role,target:$target,repository:$repository,digest:$digest,reference:$reference,platforms:$platforms,sbom:{path:$sbom_path,sha256:$sbom_sha256},provenance:{path:$provenance_path,sha256:$provenance_sha256}}' \
              >>images.ndjson
          done < <(jq -r '.roles[] | [.name, .target] | @tsv' release/release-config.json)
          jq -s 'sort_by(.role)' images.ndjson >bundle/images.json
          (
            cd bundle
            find evidence -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum >EVIDENCE.SHA256SUMS
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-images-${{ needs.gate.outputs.candidate_tag }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30

  manifest:
    name: Sign and publish candidate manifest
    needs: [gate, binaries, images]
    runs-on: ubuntu-24.04
    environment: release-candidate
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.source_commit }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-binaries-${{ needs.gate.outputs.candidate_tag }}
          path: bundle

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-images-${{ needs.gate.outputs.candidate_tag }}
          path: bundle

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.5

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0

      - name: Assemble, sign, and publish the canonical candidate
        env:
          CANDIDATE_TAG: ${{ needs.gate.outputs.candidate_tag }}
          RELEASE_ID: ${{ needs.gate.outputs.release_id }}
          SOURCE_COMMIT: ${{ needs.gate.outputs.source_commit }}
          SOURCE_REF: ${{ needs.gate.outputs.source_ref }}
          SIGNING_IDENTITY: ${{ needs.gate.outputs.signing_identity }}
        run: |
          set -euo pipefail
          python3 scripts/release_manifest.py index-binaries --root bundle --output bundle/binaries.json
          jq -n \
            --arg binary_sha256 "sha256:$(sha256sum bundle/SHA256SUMS | cut -d' ' -f1)" \
            --arg evidence_sha256 "sha256:$(sha256sum bundle/EVIDENCE.SHA256SUMS | cut -d' ' -f1)" \
            '{binaries:{path:"SHA256SUMS",sha256:$binary_sha256},evidence:{path:"EVIDENCE.SHA256SUMS",sha256:$evidence_sha256}}' \
            >bundle/checksums.json
          created_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/release_manifest.py create-candidate \
            --release-id "${RELEASE_ID}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-ref "${SOURCE_REF}" \
            --created-at "${created_at}" \
            --images bundle/images.json \
            --binaries bundle/binaries.json \
            --checksums bundle/checksums.json \
            --root bundle \
            --output bundle/release-manifest.json
          rm bundle/images.json bundle/binaries.json bundle/checksums.json
          python3 scripts/release_manifest.py validate --manifest bundle/release-manifest.json --root bundle
          cosign sign-blob --yes --bundle bundle/SHA256SUMS.sigstore.json bundle/SHA256SUMS
          cosign sign-blob --yes --bundle bundle/release-manifest.sigstore.json bundle/release-manifest.json
          cosign verify-blob --bundle bundle/SHA256SUMS.sigstore.json \
            --certificate-identity "${SIGNING_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            bundle/SHA256SUMS
          cosign verify-blob --bundle bundle/release-manifest.sigstore.json \
            --certificate-identity "${SIGNING_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            bundle/release-manifest.json
          release_repository="ghcr.io/${GITHUB_REPOSITORY,,}/releases"
          candidate_reference="${release_repository}:${CANDIDATE_TAG}"
          if oras resolve "${candidate_reference}" >/dev/null 2>&1; then
            echo "candidate tag already exists; refusing to overwrite it" >&2
            exit 1
          fi
          (
            cd bundle
            mapfile -t files < <(find . -type f -printf '%P\n' | sort)
            oras push --artifact-type application/vnd.portage-engine.release.v1+json \
              "${candidate_reference}" "${files[@]}"
          )
          candidate_oci_digest="$(oras resolve "${candidate_reference}")"
          if ! [[ "${candidate_oci_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid candidate digest" >&2
            exit 1
          fi
          cosign sign --yes "${release_repository}@${candidate_oci_digest}"
          cosign verify \
            --certificate-identity "${SIGNING_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${release_repository}@${candidate_oci_digest}" >/dev/null
          {
            echo "Candidate manifest: \`${release_repository}@${candidate_oci_digest}\`"
            echo "Canonical JSON digest: \`$(sha256sum bundle/release-manifest.json | cut -d' ' -f1)\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ needs.gate.outputs.candidate_tag }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90
