name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_manifest_ref:
        description: Digest-only GHCR candidate manifest reference
        required: true
        type: string
      expected_previous_manifest_digest:
        description: Canonical current stable manifest SHA-256, or none for the first release
        required: true
        type: string
      confirm:
        description: Explicit stable promotion confirmation
        required: true
        type: choice
        options:
          - promote-to-stable

permissions:
  contents: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Verify, promote, and sign stable manifest
    runs-on: ubuntu-24.04
    environment: release-stable
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.5

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0

      - name: Verify candidate and promotion compare-and-swap input
        id: verify
        env:
          CANDIDATE_REF: ${{ inputs.candidate_manifest_ref }}
          EXPECTED_PREVIOUS: ${{ inputs.expected_previous_manifest_digest }}
          CONFIRM: ${{ inputs.confirm }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          source scripts/oras-resolve.sh
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ] || [ "${CONFIRM}" != "promote-to-stable" ]; then
            echo "promotion must run the default-branch workflow with explicit confirmation" >&2
            exit 1
          fi
          release_repository="ghcr.io/${GITHUB_REPOSITORY,,}/releases"
          if ! [[ "${CANDIDATE_REF}" =~ ^${release_repository}@sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate_manifest_ref must be a digest reference in ${release_repository}" >&2
            exit 1
          fi
          candidate_oci_digest="${CANDIDATE_REF##*@}"
          candidate_identity_regex="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-candidate\\.yml@refs/(heads/${DEFAULT_BRANCH}|tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$"
          stable_identity_regex="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-(promote|rollback)\\.yml@refs/heads/${DEFAULT_BRANCH}$"
          cosign verify --certificate-identity-regexp "${candidate_identity_regex}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${CANDIDATE_REF}" >/dev/null
          mkdir candidate
          oras pull "${CANDIDATE_REF}" -o candidate
          cosign verify-blob --bundle candidate/release-manifest.sigstore.json \
            --certificate-identity-regexp "${candidate_identity_regex}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            candidate/release-manifest.json
          cosign verify-blob --bundle candidate/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "${candidate_identity_regex}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            candidate/SHA256SUMS
          # Validate each pulled bundle against the release config it shipped
          # with; the workflow's own checkout is a later commit than the release.
          [ -f candidate/release-config.json ] || {
            echo "candidate bundle does not carry its release config" >&2
            exit 1
          }
          candidate_manifest_digest="$(python3 scripts/release_manifest.py --config candidate/release-config.json validate --manifest candidate/release-manifest.json --root candidate)"
          if [ "$(jq -r '.release.channel' candidate/release-manifest.json)" != "candidate" ]; then
            echo "input OCI artifact is not a candidate manifest" >&2
            exit 1
          fi
          while IFS= read -r image; do
            cosign verify --certificate-identity-regexp "${candidate_identity_regex}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}" >/dev/null
          done < <(jq -r '.images[].reference' candidate/release-manifest.json)

          stable_alias="${release_repository}:stable"
          oras_resolve_into current_oci_digest "${stable_alias}"
          if [ "${EXPECTED_PREVIOUS}" = "none" ]; then
            if [ "${current_oci_digest}" != "none" ]; then
              echo "stable already exists; first-promotion expectation is stale" >&2
              exit 1
            fi
          else
            if ! [[ "${EXPECTED_PREVIOUS}" =~ ^sha256:[0-9a-f]{64}$ ]] || [ "${current_oci_digest}" = "none" ]; then
              echo "promotion requires an existing stable manifest and canonical expected digest" >&2
              exit 1
            fi
            current_ref="${release_repository}@${current_oci_digest}"
            cosign verify --certificate-identity-regexp "${stable_identity_regex}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${current_ref}" >/dev/null
            mkdir current
            oras pull "${current_ref}" -o current
            cosign verify-blob --bundle current/release-manifest.sigstore.json \
              --certificate-identity-regexp "${stable_identity_regex}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              current/release-manifest.json
            [ -f current/release-config.json ] || {
              echo "current stable bundle does not carry its release config" >&2
              exit 1
            }
            current_manifest_digest="$(python3 scripts/release_manifest.py --config current/release-config.json validate --manifest current/release-manifest.json --root current)"
            if [ "${current_manifest_digest}" != "${EXPECTED_PREVIOUS}" ]; then
              echo "current stable canonical digest does not match the promotion CAS input" >&2
              exit 1
            fi
          fi
          {
            echo "release_repository=${release_repository}"
            echo "candidate_oci_digest=${candidate_oci_digest}"
            echo "candidate_manifest_digest=${candidate_manifest_digest}"
            echo "current_oci_digest=${current_oci_digest}"
            echo "candidate_identity_regex=${candidate_identity_regex}"
            echo "stable_identity_regex=${stable_identity_regex}"
          } >>"${GITHUB_OUTPUT}"

      - name: Create and sign the stable release manifest
        env:
          EXPECTED_PREVIOUS: ${{ inputs.expected_previous_manifest_digest }}
          CANDIDATE_OCI_DIGEST: ${{ steps.verify.outputs.candidate_oci_digest }}
          CURRENT_OCI_DIGEST: ${{ steps.verify.outputs.current_oci_digest }}
          RELEASE_REPOSITORY: ${{ steps.verify.outputs.release_repository }}
          STABLE_IDENTITY_REGEX: ${{ steps.verify.outputs.stable_identity_regex }}
        run: |
          set -euo pipefail
          source scripts/oras-resolve.sh
          cp -a candidate stable
          promoted_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          args=(
            --candidate candidate/release-manifest.json
            --candidate-root candidate
            --candidate-oci-digest "${CANDIDATE_OCI_DIGEST}"
            --expected-previous-manifest-digest "${EXPECTED_PREVIOUS}"
            --expected-previous-oci-digest "${CURRENT_OCI_DIGEST}"
            --promoted-at "${promoted_at}"
            --output-root stable
            --output stable/release-manifest.json
          )
          if [ "${EXPECTED_PREVIOUS}" != "none" ]; then
            args+=(
              --current-stable current/release-manifest.json --current-root current
              --current-config current/release-config.json
            )
          fi
          python3 scripts/release_manifest.py --config candidate/release-config.json promote "${args[@]}"
          stable_manifest_digest="$(python3 scripts/release_manifest.py --config stable/release-config.json validate --manifest stable/release-manifest.json --root stable)"
          cosign sign-blob --yes --bundle stable/release-manifest.sigstore.json stable/release-manifest.json
          signing_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-promote.yml@${GITHUB_REF}"
          cosign verify-blob --bundle stable/release-manifest.sigstore.json \
            --certificate-identity "${signing_identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            stable/release-manifest.json
          release_id="$(jq -r '.release.id' stable/release-manifest.json)"
          immutable_tag="stable-${release_id}-m${stable_manifest_digest#sha256:}"
          immutable_tag="${immutable_tag:0:80}"
          oras_resolve_into existing_release_tag "${RELEASE_REPOSITORY}:stable-${release_id}"
          if [ "${existing_release_tag}" != "none" ]; then
            echo "stable release ID tag already exists; refusing to overwrite it" >&2
            exit 1
          fi
          (
            cd stable
            mapfile -t files < <(find . -type f -printf '%P\n' | sort)
            oras push --artifact-type application/vnd.portage-engine.release.v1+json \
              "${RELEASE_REPOSITORY}:${immutable_tag}" "${files[@]}"
          )
          oras_resolve_into stable_oci_digest "${RELEASE_REPOSITORY}:${immutable_tag}"
          if [ "${stable_oci_digest}" = "none" ]; then
            echo "pushed stable bundle did not resolve to a digest" >&2
            exit 1
          fi
          # Sign before anything aliases or tags this revision. Every later
          # promotion and rollback resolves `:stable` and re-verifies the
          # signature on whatever it finds, so a cutover that lands and is then
          # followed by a failed or cancelled `cosign sign` leaves the channel
          # unverifiable AND unreplaceable -- and the release ID guard above
          # refuses the re-run that would repair it. Signing first bounds the
          # worst case to a revision reachable only under its content-addressed
          # `-m<digest>` tag: never aliased, never carrying the release ID tag,
          # never the answer to "what is stable", and safe to promote again.
          cosign sign --yes "${RELEASE_REPOSITORY}@${stable_oci_digest}"
          cosign verify --certificate-identity "${signing_identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RELEASE_REPOSITORY}@${stable_oci_digest}" >/dev/null

          oras_resolve_into observed_current "${RELEASE_REPOSITORY}:stable"
          if [ "${observed_current}" != "${CURRENT_OCI_DIGEST}" ]; then
            echo "stable alias changed during promotion; refusing the cutover" >&2
            exit 1
          fi
          # Role `:stable` moves ahead of the release `:stable` so the manifest
          # that answers "what is stable" is never authoritative before the
          # images it names are reachable under that alias. Each move is an
          # idempotent write to a fixed digest and nothing write-once is
          # recorded here, so a run that dies halfway through the loop is
          # repaired by re-running the same inputs.
          while IFS=$'\t' read -r repository reference digest; do
            oras_resolve_into existing_role_tag "${repository}:stable-${release_id}"
            # A record binding the digest this run would write belongs to an
            # attempt that won its cutover and died in the role loop below;
            # re-running the same inputs finishes it. Only a record binding
            # different content is a release ID being reused.
            if [ "${existing_role_tag}" != "none" ] && [ "${existing_role_tag}" != "${digest}" ]; then
              echo "release ID ${release_id} already records ${existing_role_tag} for ${repository}" >&2
              exit 1
            fi
            oras tag "${reference}" stable
          done < <(jq -r '.images[] | [.repository, .reference, .digest] | @tsv' stable/release-manifest.json)
          oras_resolve_into observed_current "${RELEASE_REPOSITORY}:stable"
          if [ "${observed_current}" != "${CURRENT_OCI_DIGEST}" ]; then
            echo "stable alias changed before the final cutover" >&2
            exit 1
          fi
          oras tag "${RELEASE_REPOSITORY}@${stable_oci_digest}" stable
          oras_resolve_into bound_alias "${RELEASE_REPOSITORY}:stable"
          if [ "${bound_alias}" != "${stable_oci_digest}" ]; then
            echo "stable alias read-back did not bind the signed manifest" >&2
            exit 1
          fi
          # Every `stable-${release_id}` tag is written here and nowhere
          # earlier, one tag per `oras tag` so no call can half-apply. Role
          # records go first and the release repository's goes last, because
          # that last write is the only guard a re-run cannot walk over: the
          # role guard above accepts a record that already binds the same
          # digest, while the release-ID guard before the push is strict. An
          # attempt that dies anywhere in this block therefore leaves nothing
          # that blocks replaying the same inputs, and an attempt that reaches
          # the final tag has finished. Writing them only once the alias is
          # bound and read back is what keeps that true.
          while IFS=$'\t' read -r repository reference digest; do
            oras tag "${reference}" "stable-${release_id}"
            oras_resolve_into bound_role_tag "${repository}:stable-${release_id}"
            if [ "${bound_role_tag}" != "${digest}" ]; then
              echo "role release ID tag read-back did not bind ${repository}@${digest}" >&2
              exit 1
            fi
          done < <(jq -r '.images[] | [.repository, .reference, .digest] | @tsv' stable/release-manifest.json)
          oras tag "${RELEASE_REPOSITORY}@${stable_oci_digest}" "stable-${release_id}"
          oras_resolve_into bound_release_tag "${RELEASE_REPOSITORY}:stable-${release_id}"
          if [ "${bound_release_tag}" != "${stable_oci_digest}" ]; then
            echo "stable release ID tag read-back did not bind the signed manifest" >&2
            exit 1
          fi
          {
            echo "Stable authority: \`${RELEASE_REPOSITORY}@${stable_oci_digest}\`"
            echo "Canonical manifest digest: \`${stable_manifest_digest}\`"
            echo "Previous stable OCI digest: \`${CURRENT_OCI_DIGEST}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: stable/
          if-no-files-found: error
          retention-days: 90
