name: Roll back stable release

on:
  workflow_dispatch:
    inputs:
      target_manifest_ref:
        description: Digest-only previously signed stable manifest reference
        required: true
        type: string
      expected_current_manifest_digest:
        description: Canonical SHA-256 of the currently authoritative stable manifest
        required: true
        type: string
      reason:
        description: Auditable rollback reason (1-512 printable characters)
        required: true
        type: string
      confirm:
        description: Explicit rollback confirmation
        required: true
        type: choice
        options:
          - rollback-stable

permissions:
  contents: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  rollback:
    name: Verify target, record rollback, and cut over
    runs-on: ubuntu-24.04
    environment: release-stable
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.5

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0

      - name: Verify current authority and signed rollback target
        id: verify
        env:
          TARGET_REF: ${{ inputs.target_manifest_ref }}
          EXPECTED_CURRENT: ${{ inputs.expected_current_manifest_digest }}
          CONFIRM: ${{ inputs.confirm }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          source scripts/oras-resolve.sh
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ] || [ "${CONFIRM}" != "rollback-stable" ]; then
            echo "rollback must run the default-branch workflow with explicit confirmation" >&2
            exit 1
          fi
          release_repository="ghcr.io/${GITHUB_REPOSITORY,,}/releases"
          if ! [[ "${TARGET_REF}" =~ ^${release_repository}@sha256:[0-9a-f]{64}$ ]] || \
             ! [[ "${EXPECTED_CURRENT}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "rollback inputs must be digest-only references and canonical SHA-256 values" >&2
            exit 1
          fi
          target_oci_digest="${TARGET_REF##*@}"
          oras_resolve_into current_oci_digest "${release_repository}:stable"
          if [ "${current_oci_digest}" = "none" ]; then
            echo "there is no stable release to roll back from" >&2
            exit 1
          fi
          current_ref="${release_repository}@${current_oci_digest}"
          stable_identity_regex="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-(promote|rollback)\\.yml@refs/heads/${DEFAULT_BRANCH}$"
          candidate_identity_regex="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-candidate\\.yml@refs/(heads/${DEFAULT_BRANCH}|tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$"
          for reference in "${current_ref}" "${TARGET_REF}"; do
            cosign verify --certificate-identity-regexp "${stable_identity_regex}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${reference}" >/dev/null
          done
          mkdir current target
          oras pull "${current_ref}" -o current
          oras pull "${TARGET_REF}" -o target
          for directory in current target; do
            cosign verify-blob --bundle "${directory}/release-manifest.sigstore.json" \
              --certificate-identity-regexp "${stable_identity_regex}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${directory}/release-manifest.json"
            # Each signed bundle is validated against the release config it
            # shipped with, not this workflow's later checkout.
            [ -f "${directory}/release-config.json" ] || {
              echo "${directory} bundle does not carry its release config" >&2
              exit 1
            }
            python3 scripts/release_manifest.py --config "${directory}/release-config.json" \
              validate --manifest "${directory}/release-manifest.json" --root "${directory}"
            if [ "$(jq -r '.release.channel' "${directory}/release-manifest.json")" != "stable" ]; then
              echo "rollback inputs must both be stable manifests" >&2
              exit 1
            fi
          done
          current_manifest_digest="$(python3 scripts/release_manifest.py --config current/release-config.json validate --manifest current/release-manifest.json --root current)"
          if [ "${current_manifest_digest}" != "${EXPECTED_CURRENT}" ]; then
            echo "current stable canonical digest does not match rollback CAS input" >&2
            exit 1
          fi
          cosign verify-blob --bundle target/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "${candidate_identity_regex}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            target/SHA256SUMS
          while IFS= read -r image; do
            cosign verify --certificate-identity-regexp "${candidate_identity_regex}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}" >/dev/null
          done < <(jq -r '.images[].reference' target/release-manifest.json)
          {
            echo "release_repository=${release_repository}"
            echo "current_oci_digest=${current_oci_digest}"
            echo "target_oci_digest=${target_oci_digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Create a signed rollback revision and update convenience tags
        env:
          EXPECTED_CURRENT: ${{ inputs.expected_current_manifest_digest }}
          TARGET_OCI_DIGEST: ${{ steps.verify.outputs.target_oci_digest }}
          CURRENT_OCI_DIGEST: ${{ steps.verify.outputs.current_oci_digest }}
          RELEASE_REPOSITORY: ${{ steps.verify.outputs.release_repository }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          source scripts/oras-resolve.sh
          cp -a target rollback
          rolled_back_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/release_manifest.py --config target/release-config.json rollback \
            --current current/release-manifest.json \
            --current-root current \
            --current-config current/release-config.json \
            --target target/release-manifest.json \
            --target-root target \
            --target-oci-digest "${TARGET_OCI_DIGEST}" \
            --expected-current-manifest-digest "${EXPECTED_CURRENT}" \
            --expected-current-oci-digest "${CURRENT_OCI_DIGEST}" \
            --reason "${ROLLBACK_REASON}" \
            --rolled-back-at "${rolled_back_at}" \
            --output-root rollback \
            --output rollback/release-manifest.json
          rollback_manifest_digest="$(python3 scripts/release_manifest.py --config rollback/release-config.json validate --manifest rollback/release-manifest.json --root rollback)"
          cosign sign-blob --yes --bundle rollback/release-manifest.sigstore.json rollback/release-manifest.json
          signing_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-rollback.yml@${GITHUB_REF}"
          cosign verify-blob --bundle rollback/release-manifest.sigstore.json \
            --certificate-identity "${signing_identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            rollback/release-manifest.json
          release_id="$(jq -r '.release.id' rollback/release-manifest.json)"
          immutable_tag="rollback-${release_id}-m${rollback_manifest_digest#sha256:}"
          immutable_tag="${immutable_tag:0:80}"
          (
            cd rollback
            mapfile -t files < <(find . -type f -printf '%P\n' | sort)
            oras push --artifact-type application/vnd.portage-engine.release.v1+json \
              "${RELEASE_REPOSITORY}:${immutable_tag}" "${files[@]}"
          )
          oras_resolve_into rollback_oci_digest "${RELEASE_REPOSITORY}:${immutable_tag}"
          if [ "${rollback_oci_digest}" = "none" ]; then
            echo "pushed rollback bundle did not resolve to a digest" >&2
            exit 1
          fi
          # Sign before the cutover. Both stable workflows begin by resolving
          # `:stable` and verifying its signature, so an alias pointing at an
          # unsigned revision -- which is what a failed or cancelled `cosign
          # sign` after the cutover leaves behind -- blocks every subsequent
          # rollback and promotion, including the one that would repair it. A
          # revision signed first and then abandoned by a lost compare-and-swap
          # is inert: reachable only under its content-addressed `-m<digest>`
          # tag, never aliased, and the same inputs can simply be re-run.
          cosign sign --yes "${RELEASE_REPOSITORY}@${rollback_oci_digest}"
          cosign verify --certificate-identity "${signing_identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${RELEASE_REPOSITORY}@${rollback_oci_digest}" >/dev/null

          oras_resolve_into observed_current "${RELEASE_REPOSITORY}:stable"
          if [ "${observed_current}" != "${CURRENT_OCI_DIGEST}" ]; then
            echo "stable alias changed during rollback; refusing the cutover" >&2
            exit 1
          fi
          # Role `:stable` moves ahead of the release `:stable` so the manifest
          # that answers "what is stable" is never authoritative before the
          # images it names are reachable under that alias. Nothing write-once
          # is recorded here or anywhere later in this workflow -- a rollback
          # re-publishes release IDs that were already recorded by the
          # promotion it reverts to -- so a run that dies partway leaves only
          # idempotent alias writes and the same inputs can simply be re-run.
          while IFS=$'\t' read -r _ reference; do
            oras tag "${reference}" stable
          done < <(jq -r '.images[] | [.repository, .reference] | @tsv' rollback/release-manifest.json)
          oras_resolve_into observed_current "${RELEASE_REPOSITORY}:stable"
          if [ "${observed_current}" != "${CURRENT_OCI_DIGEST}" ]; then
            echo "stable alias changed before the rollback cutover" >&2
            exit 1
          fi
          oras tag "${RELEASE_REPOSITORY}@${rollback_oci_digest}" stable
          oras_resolve_into bound_alias "${RELEASE_REPOSITORY}:stable"
          if [ "${bound_alias}" != "${rollback_oci_digest}" ]; then
            echo "stable alias read-back did not bind the signed rollback revision" >&2
            exit 1
          fi
          {
            echo "Rollback authority: \`${RELEASE_REPOSITORY}@${rollback_oci_digest}\`"
            echo "Canonical rollback manifest digest: \`${rollback_manifest_digest}\`"
            echo "Replaced stable OCI digest: \`${CURRENT_OCI_DIGEST}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback/
          if-no-files-found: error
          retention-days: 90
