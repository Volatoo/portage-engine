name: PR Build Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download dependencies
        run: go mod download

      - name: Build the console bundle
        # portage-dashboard embeds this with `//go:embed all:bundle`, and an
        # unbuilt tree matches nothing but .gitkeep. Without it the binary
        # answers 503 on every console route and the dashboard tests fail on
        # the routes that serve it.
        run: |
          set -eu
          npm ci
          npm run build
        working-directory: web

      - name: Build portage-server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o bin/portage-server-${{ matrix.goos }}-${{ matrix.goarch }} cmd/server/main.go

      - name: Build portage-dashboard
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o bin/portage-dashboard-${{ matrix.goos }}-${{ matrix.goarch }} cmd/dashboard/main.go

      - name: Build portage-builder
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o bin/portage-builder-${{ matrix.goos }}-${{ matrix.goarch }} cmd/builder/main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*
          retention-days: 7

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Test build
        run: go build ./...

      - name: golangci-lint
        # golangci-lint v2.x is required because .golangci.yml uses the v2 config
        # format (version: "2"). v1.x (e.g. v1.55.2) cannot parse it. The pin
        # also has a floor: a release built with Go older than go.mod's 1.26.4
        # refuses to load the config at all and exits 3.
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12.2
          args: --timeout=5m -v

  test-check:
    name: Test Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download dependencies
        run: go mod download

      - name: Build the console bundle
        # portage-dashboard embeds this with `//go:embed all:bundle`, and an
        # unbuilt tree matches nothing but .gitkeep. Without it the binary
        # answers 503 on every console route and the dashboard tests fail on
        # the routes that serve it.
        run: |
          set -eu
          npm ci
          npm run build
        working-directory: web

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run release contract tests
        run: make test-release

      - name: Upload coverage
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          file: ./coverage.out
          flags: pr-unittests
          fail_ci_if_error: false
