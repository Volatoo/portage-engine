name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Test build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.7.2
          args: --timeout=5m -v

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build test Docker image
        run: docker build -f Dockerfile.test -t portage-test:latest .

      - name: Run tests in container
        # -race is re-enabled now that the code is race-clean.
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app portage-test:latest go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          for command in \
            artifact-lifecycle builder capacity-actuator client dashboard \
            desktop-runner image-factory migrate server signer
          do
            CGO_ENABLED=0 go build -trimpath \
              -o "bin/portage-${command}-${{ matrix.goos }}-${{ matrix.goarch }}" \
              "./cmd/${command}"
          done
          (cd bin && sha256sum portage-* > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*

  supply-chain:
    name: Runtime SBOM and provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Generate target-specific attestations
        run: |
          set -eu
          mkdir -p supply-chain
          for target in \
            api-runtime dashboard-runtime migrate-runtime signer-runtime \
            executor-runtime actuator-runtime artifact-lifecycle-runtime
          do
            output="${RUNNER_TEMP}/portage-engine-${target}"
            docker buildx build \
              --target "${target}" \
              --attest "type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68" \
              --provenance=mode=max \
              --output "type=local,dest=${output}" \
              .
            cp "${output}/sbom.spdx.json" \
              "supply-chain/${target}.sbom.spdx.json"
            cp "${output}/provenance.json" \
              "supply-chain/${target}.provenance.json"
          done
          (cd supply-chain && sha256sum ./*.json > SHA256SUMS)

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-sbom-provenance
          path: supply-chain/*
          retention-days: 30

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate release schemas, permissions, and failure paths
        run: make test-release
