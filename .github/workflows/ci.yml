name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Test build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=5m -v

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test Docker image
        run: docker build -f Dockerfile.test -t portage-test:latest .

      - name: Run tests in container
        # -race is re-enabled now that the code is race-clean.
        run: docker run --rm -v ${{ github.workspace }}:/app -w /app portage-test:latest go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          for command in \
            artifact-lifecycle builder capacity-actuator client dashboard \
            desktop-runner image-factory migrate server signer
          do
            CGO_ENABLED=0 go build -trimpath \
              -o "bin/portage-${command}-${{ matrix.goos }}-${{ matrix.goarch }}" \
              "./cmd/${command}"
          done
          (cd bin && sha256sum portage-* > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*

  supply-chain:
    name: Runtime SBOM and provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate target-specific attestations
        run: |
          set -eu
          mkdir -p supply-chain
          for target in \
            api-runtime dashboard-runtime migrate-runtime signer-runtime \
            executor-runtime actuator-runtime artifact-lifecycle-runtime
          do
            output="${RUNNER_TEMP}/portage-engine-${target}"
            docker buildx build \
              --target "${target}" \
              --attest "type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68" \
              --provenance=mode=max \
              --output "type=local,dest=${output}" \
              .
            cp "${output}/sbom.spdx.json" \
              "supply-chain/${target}.sbom.spdx.json"
            cp "${output}/provenance.json" \
              "supply-chain/${target}.provenance.json"
          done
          (cd supply-chain && sha256sum *.json > SHA256SUMS)

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-sbom-provenance
          path: supply-chain/*
          retention-days: 30
