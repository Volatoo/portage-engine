name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Test build
        # Deliberately with no npm run before it. The dashboard embeds the
        # console bundle, and this job is the standing proof that a Go-only
        # checkout still compiles: the committed placeholder inside
        # internal/dashboard/webassets/bundle keeps the //go:embed pattern
        # matching, and /ui reports the missing bundle at runtime instead of the
        # build failing for everyone who has not installed node.
        run: go build ./...

      - name: golangci-lint
        # The pin has a floor, not just a ceiling: golangci-lint refuses to load
        # a config whose module targets a language version above the Go it was
        # built with, and go.mod is go 1.26.6. v2.7.2 is built with go1.25 and
        # exits 3 on `can't load config` before linting a single file, so this
        # must stay on a release built with Go 1.26 or newer.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m -v

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # The scheduler claim, admission, phase-claim and worker-certificate
      # paths only have concurrent coverage in internal/persistence's
      # integration suite, and that suite is skip-by-default. Without a real
      # PostgreSQL here they never execute anywhere in CI.
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: portage_engine_test
          POSTGRES_USER: portage
          POSTGRES_PASSWORD: portage-ci-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portage -d portage_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the console bundle
        # Dockerfile.test copies the checkout in, so the bundle has to exist on
        # the host before the image is built. Four dashboard cases serve the
        # console and get 503 from an unbuilt bundle.
        run: |
          set -eu
          npm ci
          npm run build
        working-directory: web

      - name: Build test Docker image
        run: docker build -f Dockerfile.test -t portage-test:latest .

      - name: Run tests in container
        # -race is re-enabled now that the code is race-clean.
        # --network host is what makes the service container reachable: the
        # Gentoo test image otherwise runs on the default bridge, where
        # 127.0.0.1 is the test container itself and every integration case
        # would silently skip instead of connecting.
        env:
          PORTAGE_TEST_DATABASE_URL: postgres://portage:portage-ci-local@127.0.0.1:5432/portage_engine_test?sslmode=disable
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PORTAGE_TEST_DATABASE_URL \
            -v "${{ github.workspace }}:/app" -w /app portage-test:latest \
            go test -v -race -coverprofile=coverage.out ./... 2>&1 | tee go-test.log

      - name: Assert the PostgreSQL integration suite executed
        # Every case in the suite calls t.Skip when PORTAGE_TEST_DATABASE_URL is
        # empty, so a green `go test` proves nothing by itself. Naming the cases
        # is what makes an unset or wrong URL red: PASS becomes SKIP or FAIL.
        run: |
          set -euo pipefail
          for name in \
            TestPostgresMigrationTransactionAndCompatibility \
            TestProjectResourceAndArtifactMigrationsRequireDrainedAttempts \
            TestSigningQueueDigestFenceConcurrencyAndReclaim \
            TestJobLedgerIdempotencyTransitionsOutboxAndReconcile \
            TestPostgresSchedulerFairnessAndAutoscaling \
            TestPostgresDistributedBuildAlpha
          do
            grep -q -- "--- PASS: ${name} " go-test.log || {
              echo "${name} did not execute against PostgreSQL" >&2
              exit 1
            }
          done

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  console:
    name: Operator console
    runs-on: ubuntu-latest
    env:
      # The verbose reporter's output is read back below. Colour codes would sit
      # between the marker and the test name and break every grep.
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install console dependencies
        # `npm ci` rather than `npm install`: it installs exactly the tree the
        # committed lockfile records and fails when package.json and the lockfile
        # disagree, which is what makes the build reproducible offline.
        run: npm ci
        working-directory: web

      - name: Build console
        run: npm run build
        working-directory: web

      - name: Lint console
        # eslint, stylelint and prettier --check. stylelint is in there because
        # the console this replaces kept its stylesheet in a Go string constant,
        # where a rule that broke the shell on every page passed go build, go vet,
        # go test and golangci-lint without being read as CSS once.
        run: npm run lint
        working-directory: web

      - name: Test console
        run: |
          set -euo pipefail
          npm run test 2>&1 | tee "${RUNNER_TEMP}/vitest.log"
        working-directory: web

      - name: Assert the console suite executed
        # A green `npm run test` proves nothing on its own: an include pattern
        # that stops matching, or a describe block turned into describe.skip,
        # both report success. Naming the cases that carry the invariants makes
        # either of those red. The summary check is the second half — a skipped
        # case still prints its name, so the names alone would pass a suite that
        # quietly stopped running.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/vitest.log"
          for name in \
            "falls back to the language stamped on the html element when the payload is missing" \
            "does not read the operating system locale when the server sent nothing" \
            "leaves the principal unknown rather than inventing an anonymous one" \
            "turns a flag on only for a literal true, so a drifted payload fails closed" \
            "declares every dark token in the light block, so a dark typo cannot be silent" \
            "draws the focus ring as an outline, which forced colors keeps" \
            "clamps every animation under prefers-reduced-motion: reduce"
          do
            grep -qF -- "${name}" "${log}" || {
              echo "console case '${name}' did not run" >&2
              exit 1
            }
          done
          summary=$(grep -E '^[[:space:]]*Tests[[:space:]]+' "${log}" | tail -1)
          echo "vitest summary: ${summary}"
          case "${summary}" in
            *skipped*|*failed*|*todo*)
              echo "the console suite did not finish with every case passed" >&2
              exit 1
              ;;
          esac

      - name: Go tests against the built bundle
        run: |
          set -euo pipefail
          go test -v ./internal/dashboard/... 2>&1 | tee "${RUNNER_TEMP}/console-go-test.log"

      - name: Assert the tests that need a built bundle executed
        # These two skip when npm has not run, which is the normal state of a
        # working copy and of the Go test job. Naming them is what makes a build
        # ordering mistake red: PASS becomes SKIP the moment the bundle is
        # missing, and a suite full of SKIP is still a green `go test`.
        run: |
          set -euo pipefail
          for name in \
            TestBuiltBundleIsMountedAtTheAssetPrefixTheServerServes \
            TestConsoleServesTheShellForEveryRouteItNames
          do
            grep -q -- "--- PASS: ${name} " "${RUNNER_TEMP}/console-go-test.log" || {
              echo "${name} did not execute against a built console bundle" >&2
              exit 1
            }
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Build the console bundle
        # Before the Go build, because the dashboard binary embeds it. Without
        # this the uploaded artifact would start, serve every old route, and
        # answer 503 on /ui — a defect only a browser would find.
        run: |
          set -eu
          npm ci
          npm run build
        working-directory: web

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          for command in \
            artifact-lifecycle builder capacity-actuator client dashboard \
            desktop-runner image-factory migrate server signer
          do
            CGO_ENABLED=0 go build -trimpath \
              -o "bin/portage-${command}-${{ matrix.goos }}-${{ matrix.goarch }}" \
              "./cmd/${command}"
          done
          (cd bin && sha256sum portage-* > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/*

  supply-chain:
    name: Runtime SBOM and provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.0
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Generate target-specific attestations
        run: |
          set -eu
          mkdir -p supply-chain
          for target in \
            api-runtime dashboard-runtime migrate-runtime signer-runtime \
            executor-runtime actuator-runtime artifact-lifecycle-runtime
          do
            output="${RUNNER_TEMP}/portage-engine-${target}"
            docker buildx build \
              --target "${target}" \
              --attest "type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68" \
              --provenance=mode=max \
              --output "type=local,dest=${output}" \
              .
            cp "${output}/sbom.spdx.json" \
              "supply-chain/${target}.sbom.spdx.json"
            cp "${output}/provenance.json" \
              "supply-chain/${target}.provenance.json"
          done
          (cd supply-chain && sha256sum ./*.json > SHA256SUMS)

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-sbom-provenance
          path: supply-chain/*
          retention-days: 30

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release schemas, permissions, and failure paths
        run: make test-release

  operational-gates:
    name: Recovery, public edge, and executor gates
    runs-on: ubuntu-latest
    services:
      # The executor gate's drain and live-work delete boundaries are SQL
      # decisions. Without a database here the case that carries them skips, and
      # a skipped case is a passing `go test` — the gate would keep reporting
      # those boundaries as verified while never executing one of them.
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: portage_engine_test
          POSTGRES_USER: portage
          POSTGRES_PASSWORD: portage-ci-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portage -d portage_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      # ubuntu-latest ships jq but not ripgrep, and every gate in this job
      # resolves `rg` from PATH. The runner also carries a moving Packer release,
      # while the offline image-factory contract intentionally fixes Packer at
      # 1.15.4. Install and authenticate that exact binary so a runner image
      # refresh cannot invalidate the template gate.
      - name: Install gate tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep unzip
          packer_archive="${RUNNER_TEMP}/packer_1.15.4_linux_amd64.zip"
          curl --fail --location --silent --show-error \
            --output "${packer_archive}" \
            https://releases.hashicorp.com/packer/1.15.4/packer_1.15.4_linux_amd64.zip
          echo "15f97a6a99645c7d5308c609973b5280837b38e112beac413ccbce80da927cf1  ${packer_archive}" | \
            sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/packer-bin"
          unzip -q "${packer_archive}" -d "${RUNNER_TEMP}/packer-bin"
          echo "${RUNNER_TEMP}/packer-bin" >> "${GITHUB_PATH}"

      - name: Recovery drill and evidence validators
        run: make test-recovery

      - name: Public edge repository contract
        # Exit 3 means a Docker-dependent check could not run on this runner;
        # only an actual contract mismatch (exit 1) may fail the job, and any
        # other status is a real error rather than a skipped probe.
        run: |
          set -uo pipefail
          # The runner's default shell already has -e, which would abort here on
          # the gate's own not-run status before it can be classified.
          set +e
          scripts/validate-public-edge.sh --output "${RUNNER_TEMP}/public-edge.json"
          status=$?
          set -e
          case "${status}" in
            0|3) exit 0 ;;
            *) exit "${status}" ;;
          esac

      - name: Persistent executor template contract
        env:
          PORTAGE_TEST_DATABASE_URL: postgres://portage:portage-ci-local@127.0.0.1:5432/portage_engine_test?sslmode=disable
        run: |
          set -euo pipefail
          make test-persistent-executor-gate 2>&1 | tee "${RUNNER_TEMP}/executor-gate.log"

      - name: Assert the capacity delete boundaries executed
        # The gate says not-run out loud when it has no database, and exits 0
        # either way so a developer without PostgreSQL can still run it. In CI
        # there is a database, so not-run here means the wiring above broke.
        run: |
          set -euo pipefail
          if grep -q '^NOT-RUN capacity delete boundaries' "${RUNNER_TEMP}/executor-gate.log"; then
            echo "the capacity delete boundaries did not run against the service database" >&2
            exit 1
          fi

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operational-gate-evidence
          path: ${{ runner.temp }}/public-edge.json
          if-no-files-found: warn
          retention-days: 30
