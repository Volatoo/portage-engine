name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # 每周一凌晨 UTC 运行一次
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: 'v0.69.3'
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Display Trivy results
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            echo "=== Trivy Scan Results ==="
            cat trivy-results.json | jq '.Results[]? | select(.Vulnerabilities != null) | {Resource: .Target, VulnerabilityCount: (.Vulnerabilities | length)}' | head -50
          fi

  gosec-scan:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
          cache: true

      # Use the same analyzer, suppressions, and path exclusions as local lint.
      # This keeps the dedicated security job aligned with pre-commit and the
      # regular CI lint job while retaining G124/G703/G704 coverage.
      - name: Run gosec security scanner
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.7.2
          args: --enable-only=gosec --timeout=5m -v
