name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # 每周一凌晨 UTC 运行一次
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two passes: SARIF is what reaches code scanning and must be produced
      # even when findings exist, so the failing verdict is a separate scan.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: 'v0.69.3'
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-fs

      - name: Fail on CRITICAL or HIGH findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: 'v0.69.3'
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  gosec-scan:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      # Use the same analyzer, suppressions, and path exclusions as local lint.
      # This keeps the dedicated security job aligned with pre-commit and the
      # regular CI lint job while retaining G124/G703/G704 coverage. The version
      # is kept identical to ci.yml and the Makefile on purpose, and has a floor:
      # see the comment on the CI lint step.
      - name: Run gosec security scanner
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --enable-only=gosec --timeout=5m -v

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check production and development dependencies
        run: npm audit --audit-level=high
        working-directory: web

  # Keep this job ID in security-scan.yml. Earlier results use this analysis
  # key, so continuity is what lets GitHub mark findings fixed when a later
  # scan no longer reports them instead of leaving stale alerts open forever.
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
