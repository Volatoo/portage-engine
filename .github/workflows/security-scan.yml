name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # 每周一凌晨 UTC 运行一次
    - cron: '0 0 * * 1'

jobs:
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Display Trivy results
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            echo "=== Trivy Scan Results ==="
            cat trivy-results.json | jq '.Results[]? | select(.Vulnerabilities != null) | {Resource: .Target, VulnerabilityCount: (.Vulnerabilities | length)}' | head -50
          fi

  gosec-scan:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      # Use the same analyzer, suppressions, and path exclusions as local lint.
      # This keeps the dedicated security job aligned with pre-commit and the
      # regular CI lint job while retaining G124/G703/G704 coverage.
      - name: Run gosec security scanner
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --enable-only=gosec --timeout=5m -v

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Upload CodeQL results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: /home/runner/work/portage-engine/results/
          retention-days: 7
        continue-on-error: true

      - name: CodeQL Analysis Summary
        if: always()
        run: echo "CodeQL analysis completed. Check the Security tab in GitHub for detailed results if code scanning is enabled, or download the artifacts to view the SARIF file."
