# Optional local two-replica control-plane overlay.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d
#
# Both replicas share PostgreSQL, Redis and portage-state. PostgreSQL remains
# the sole queue/cleanup/publication authority; Redis is only an accelerator.
services:
  portage-server-secondary:
    extends:
      file: docker-compose.yml
      service: portage-server
    environment:
      CONTROL_PLANE_ID: compose-secondary
      SERVER_PORT: "8082"
    ports: !override
      - "127.0.0.1:${PORTAGE_SERVER_SECONDARY_PORT:-18082}:8082"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8082'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
