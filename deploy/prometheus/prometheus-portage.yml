# Standalone Prometheus scrape snippet for Portage Engine.
#
# docker-compose.yml uses deploy/observability/prometheus.yml instead. If
# Prometheus runs on the host, keep localhost:18080 below. If it runs on the
# Compose network, use portage-server:8080.

scrape_configs:
  - job_name: 'portage-engine-server'
    scrape_interval: 15s
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['localhost:18080']
        labels:
          component: 'server'

    # If metrics password is set, use basic_auth:
    # basic_auth:
    #   username: 'metrics'
    #   password: 'your-metrics-password'

# Native disposable builders do not expose a stable host scrape endpoint.
