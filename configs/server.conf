# Portage Engine Server Configuration
#
# This file holds BOOTSTRAP configuration only: ports, data paths, and
# security material the server needs before it can serve anything.
#
# Everything operational — cloud providers (PVE/GCP/AWS), SSH deployment,
# builder binary delivery and instance TTL — is managed in the dashboard.
# With PostgreSQL enabled, non-secret values are versioned/audited in
# runtime_settings. Credential values are never persisted by the API and must
# be injected by the deployment secret provider. cloud-settings.json exists
# only for database-disabled standalone compatibility.
#
# Precedence for every key: process environment > this file > built-in default.
#
# Headless PVE password authentication may be supplied only through the
# process environment as CLOUD_PVE_USERNAME/CLOUD_PVE_PASSWORD. Do not persist
# those values in this bootstrap file; API tokens remain preferred.

# Server bind port
SERVER_PORT=8080
# Stable identity shared by scheduler slots from this replica.
CONTROL_PLANE_ID=

# Root of the public binhost tree. Each catalog profile owns a PKGDIR below
# releases/<arch>/binpackages/<profile-generation>/<target>.
BINPKG_PATH=/var/cache/binpkgs

# Maximum concurrent build workers
MAX_WORKERS=5

# Storage for build artifacts: local (s3/http not yet implemented)
STORAGE_TYPE=local
STORAGE_LOCAL_DIR=/var/cache/binpkgs

# ===== Data Persistence =====
# Directory for standalone compatibility state and local operational files.
# PostgreSQL-enabled deployments do not read/write JSON job snapshots.
DATA_DIR=/var/lib/portage-engine/server

# PostgreSQL schema v5 is the durable scheduler and job/runtime authority.
# When REQUIRED is true, startup and /readyz fail unless it is reachable and
# compatible. The server never runs migrations; execute portage-migrate first.
DATABASE_ENABLED=false
DATABASE_REQUIRED=false
# DATABASE_URL=postgres://user:password@host:5432/portage_engine?sslmode=verify-full
PGHOST=127.0.0.1
PGPORT=5432
PGDATABASE=portage_engine
PGUSER=portage
PGPASSWORD=
# verify-full is the safe remote default. "disable" is acceptable only for a
# trusted host-local/private Compose network.
PGSSLMODE=verify-full
DATABASE_MAX_CONNS=10
DATABASE_MIN_CONNS=1
DATABASE_CONNECT_TIMEOUT_SECONDS=10
DATABASE_HEALTH_TIMEOUT_SECONDS=2

# Redis is an optional, disposable accelerator. Correctness falls back to
# PostgreSQL polling when it is down; set REQUIRED only when real-time UI is a
# deployment-level readiness requirement.
REDIS_ENABLED=false
REDIS_REQUIRED=false
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_PASSWORD=
REDIS_DB=0
REDIS_TLS_ENABLED=false
REDIS_KEY_PREFIX=portage-engine
RATE_LIMIT_PER_MINUTE=120
RATE_LIMIT_BURST=30

# Server-owned profile/repository/image/mirror catalog. Leave empty during the
# single-template compatibility phase; production multi-profile deployments
# should point this at a reviewed catalog based on configs/catalog.example.json.
CATALOG_PATH=
# Optional read-only milestone/evidence snapshot consumed by the WebUI.
IMAGE_FACTORY_STATUS_PATH=

# ===== GPG signing =====
# The server only reads GPG_PUBLIC_KEY_PATH and submits digest-bound work to
# PostgreSQL. Run portage-signer as a separate process with its own database
# role and private GPG_HOME mount; do not mount that private directory into the
# server, dashboard, builder, or verifier.
# Auto-create is a bootstrap convenience. It persists an active-key marker in
# GPG_HOME and reuses it after restart. Production should provision a release
# subkey, set GPG_KEY_ID explicitly, and disable GPG_AUTO_CREATE.
GPG_ENABLED=false
GPG_KEY_ID=
GPG_KEY_PATH=
GPG_AUTO_CREATE=true
GPG_KEY_NAME=Portage Engine
GPG_KEY_EMAIL=portage@localhost
GPG_HOME=/var/lib/portage-signer/gpg
GPG_PUBLIC_KEY_PATH=/var/lib/portage-engine/signing/public.asc

# ===== Security =====
# API key for authenticating API requests (X-API-Key or Bearer header).
# Leave empty to disable authentication (NOT recommended for production).
# Generate with: openssl rand -hex 32
API_KEY=

# Shared secret the server presents to remote builders. Must equal the
# builder's BUILDER_TOKEN. Leave empty only if builders are unauthenticated
# (NOT recommended — the build endpoint runs code as root).
# Generate with: openssl rand -hex 32
BUILDER_TOKEN=

# CORS allowed origins (comma-separated). Empty allows all origins (*).
CORS_ALLOWED_ORIGINS=

# General maximum request body size in bytes (default: 10485760 = 10 MiB).
# ConfigBundle build submission is additionally capped at 2 MiB by its endpoint.
MAX_REQUEST_BODY_BYTES=10485760

# ===== Metrics =====
# METRICS_ENABLED=true exposes Prometheus metrics at GET /metrics on the main
# port (see deploy/prometheus/prometheus-portage.yml for a scrape job).
METRICS_ENABLED=false
# METRICS_PASSWORD=your-secure-password-here
