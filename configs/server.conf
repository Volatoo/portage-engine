# Portage Engine Server Configuration

# trusted: self-hosted/LAN compatibility. public: enforce the production
# boundary documented in docs/PRODUCTION_BOUNDARY.md and refuse unsafe startup.
DEPLOYMENT_MODE=trusted
#
# This file holds BOOTSTRAP configuration only: ports, data paths, and
# security material the server needs before it can serve anything.
#
# Everything operational — cloud providers (PVE/GCP/AWS), SSH deployment,
# builder binary delivery and instance TTL — is managed in the dashboard.
# With PostgreSQL enabled, non-secret values are versioned/audited in
# runtime_settings. Credential values are never persisted by the API and must
# be injected by the deployment secret provider. cloud-settings.json exists
# only for database-disabled standalone compatibility.
#
# Precedence for every key: process environment > this file > built-in default.
#
# Headless PVE password authentication may be supplied only through the
# process environment as CLOUD_PVE_USERNAME/CLOUD_PVE_PASSWORD. Do not persist
# those values in this bootstrap file; API tokens remain preferred.

# Server bind port
SERVER_PORT=8080
# Stable identity shared by scheduler slots from this replica.
CONTROL_PLANE_ID=
# control-plane exposes the community API and optional Worker Gateway listener.
# executor starts no listener and only runs durable phase-executor slots.
SERVER_RUNTIME_ROLE=control-plane

# Root of the public binhost tree. Each catalog profile owns a PKGDIR below
# releases/<arch>/binpackages/<profile-generation>/<target>.
BINPKG_PATH=/var/cache/binpkgs

# Maximum concurrent build workers
MAX_WORKERS=5

# Storage for build artifacts: local or s3. HTTP is deliberately not an
# authority backend; it remains a read-only distribution surface.
STORAGE_TYPE=local
STORAGE_LOCAL_DIR=/var/cache/binpkgs
# S3-compatible authority (required by DEPLOYMENT_MODE=public). Credentials use
# the standard AWS SDK chain or workload identity.
# STORAGE_S3_BUCKET=portage-engine-artifacts
# STORAGE_S3_REGION=us-east-1
# STORAGE_S3_PREFIX=gentoo/releases/amd64/binpackages/23.0/x86-64/
# STORAGE_S3_ENDPOINT=https://s3.internal.example
# STORAGE_S3_USE_PATH_STYLE=false
# STORAGE_S3_PUBLIC_BASE_URL=https://binpkgs.example.org
# Required only by executor/signer lifecycle roles. In production, grant
# DeleteObject solely for <prefix>/.quarantine/*, never published generations.
# STORAGE_S3_ALLOW_DELETE=false

# ===== Data Persistence =====
# Directory for standalone compatibility state and local operational files.
# PostgreSQL-enabled deployments do not read/write JSON job snapshots.
DATA_DIR=/var/lib/portage-engine/server

# PostgreSQL schema v28 is the durable scheduler, IAM/device authorization,
# job/runtime, capacity,
# worker-decision and target-monitor authority.
# When REQUIRED is true, startup and /readyz fail unless it is reachable and
# compatible. The server never runs migrations; execute portage-migrate first.
DATABASE_ENABLED=false
DATABASE_REQUIRED=false
# DATABASE_URL=postgres://user:password@host:5432/portage_engine?sslmode=verify-full
PGHOST=127.0.0.1
PGPORT=5432
PGDATABASE=portage_engine
PGUSER=portage
PGPASSWORD=
# verify-full is the safe remote default. "disable" is acceptable only for a
# trusted host-local/private Compose network.
PGSSLMODE=verify-full
DATABASE_MAX_CONNS=10
DATABASE_MIN_CONNS=1
DATABASE_CONNECT_TIMEOUT_SECONDS=10
DATABASE_HEALTH_TIMEOUT_SECONDS=2

# Redis is an optional, disposable accelerator. Correctness falls back to
# PostgreSQL polling when it is down; set REQUIRED only when real-time UI is a
# deployment-level readiness requirement.
REDIS_ENABLED=false
REDIS_REQUIRED=false
REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_PASSWORD=
REDIS_DB=0
REDIS_TLS_ENABLED=false
REDIS_KEY_PREFIX=portage-engine
RATE_LIMIT_PER_MINUTE=120
RATE_LIMIT_BURST=30

# Server-owned profile/repository/image/mirror catalog. Leave empty during the
# single-template compatibility phase; production multi-profile deployments
# should point this at a reviewed catalog based on configs/catalog.example.json.
CATALOG_PATH=
# Optional read-only milestone/evidence snapshot consumed by the WebUI.
IMAGE_FACTORY_STATUS_PATH=

# ===== GPG signing =====
# The server only reads GPG_PUBLIC_KEY_PATH and submits digest-bound work to
# PostgreSQL. Run portage-signer as a separate process with its own database
# role and private GPG_HOME mount; do not mount that private directory into the
# server, dashboard, builder, or verifier.
# Auto-create is a bootstrap convenience. It persists an active-key marker in
# GPG_HOME and reuses it after restart. Production should provision a release
# subkey, set GPG_KEY_ID explicitly, and disable GPG_AUTO_CREATE.
GPG_ENABLED=false
GPG_KEY_ID=
GPG_KEY_PATH=
GPG_AUTO_CREATE=true
GPG_KEY_NAME=Portage Engine
GPG_KEY_EMAIL=portage@localhost
GPG_HOME=/var/lib/portage-signer/gpg
GPG_PUBLIC_KEY_PATH=/var/lib/portage-engine/signing/public.asc

# ===== Security =====
# Authentication migration mode:
#   legacy — X-API-Key/Bearer shared administrator key (trusted alpha)
#   hybrid — federated users plus the legacy administrator key
#   oidc   — federated identity providers only (name retained for compatibility)
AUTH_MODE=legacy
# Legacy/hybrid administrator key. Generate with: openssl rand -hex 32
API_KEY=
# Independent credential required in X-Step-Up-Key for high-risk legacy/hybrid
# writes. It must not equal API_KEY.
STEP_UP_API_KEY=
# Preferred community configuration: JSON provider registry shared by server
# and dashboard. Secrets are named by each provider's client_secret_env and
# supplied by the deployment environment.
AUTH_PROVIDERS_PATH=
# Comma-separated provider-id:external-subject bootstrap administrators.
AUTH_ADMIN_IDENTITIES=
# Legacy single-OIDC compatibility.
OIDC_ISSUER_URL=
OIDC_AUDIENCE=
# Accepted only with the legacy single OIDC provider.
OIDC_ADMIN_SUBJECTS=
# Trusted private-network development only. This allows an HTTP issuer but
# does not protect bearer tokens on the client-to-control-plane hop.
OIDC_ALLOW_INSECURE_HTTP=false
# Server-side bounds apply to Portage Engine's opaque federated session.
OIDC_SESSION_IDLE_MINUTES=60
OIDC_SESSION_MAX_MINUTES=720
# Browser page for CLI device authorization. Public deployments require the
# exact HTTPS Dashboard /device URL; do not include query parameters.
DEVICE_AUTHORIZATION_VERIFICATION_URI=
# Sensitive writes require auth_time within this window. Optional AMR/ACR
# lists require the fresh token to contain at least one configured value.
OIDC_STEP_UP_MAX_AGE_MINUTES=10
OIDC_STEP_UP_AMR_VALUES=
OIDC_STEP_UP_ACR_VALUES=

# Legacy push-mode shared secret the server presents to remote builders. Must equal the
# builder's BUILDER_TOKEN. Leave empty only if builders are unauthenticated
# (NOT recommended — the build endpoint runs code as root).
# Generate with: openssl rand -hex 32
BUILDER_TOKEN=

# CORS allowed origins (comma-separated). Empty allows all origins (*).
CORS_ALLOWED_ORIGINS=

# General maximum request body size in bytes (default: 10485760 = 10 MiB).
# ConfigBundle build submission is additionally capped at 2 MiB by its endpoint.
MAX_REQUEST_BODY_BYTES=10485760

# ===== Outbound Worker Gateway =====
# Dedicated worker-only mTLS listener. This does not force HTTPS on the normal
# SERVER_PORT: the UI/control plane may remain HTTP on a trusted LAN.
# Requires PostgreSQL required mode. WORKER_GATEWAY_ADVERTISE_URL must be
# reachable through the selected profile's egress policy. In a multi-replica
# deployment it must route back to the issuing/executing replica rather than
# round-robin process-local gateway sessions.
WORKER_GATEWAY_ENABLED=false
WORKER_GATEWAY_PORT=9443
WORKER_GATEWAY_ADVERTISE_URL=
# Server leaf certificate/key for the 9443 listener and the CA workers use to
# verify that leaf. The client CA verifies short-lived worker certificates.
WORKER_GATEWAY_TLS_CERT=
WORKER_GATEWAY_TLS_KEY=
WORKER_GATEWAY_SERVER_CA=
WORKER_GATEWAY_CLIENT_CA=
# Stable logical issuer ID plus provider. `file` reloads an operator-owned CA
# on each issuance. `vault` generates the worker key/CSR locally and calls only
# the configured PKI role's sign endpoint; the CA key remains inside Vault.
WORKER_GATEWAY_ISSUER_ID=portage-engine-local
WORKER_GATEWAY_ISSUER_PROVIDER=file
# Operator-owned workload CA used online to issue one attempt-bound leaf. Keep
# the issuer key mode 0600 and outside source control/container images.
WORKER_GATEWAY_ISSUER_CERT=
WORKER_GATEWAY_ISSUER_KEY=
# Vault provider settings. Address must be an HTTPS origin. The token file must
# be a regular non-symlink file unreadable by group/others (mode 0600). Prefer
# a Vault Agent file sink that continuously renews/replaces a narrow token.
WORKER_GATEWAY_VAULT_ADDRESS=
WORKER_GATEWAY_VAULT_MOUNT=pki
WORKER_GATEWAY_VAULT_ROLE=portage-worker
WORKER_GATEWAY_VAULT_TOKEN_FILE=
WORKER_GATEWAY_VAULT_NAMESPACE=
# Optional private CA used to verify Vault's HTTPS listener.
WORKER_GATEWAY_VAULT_SERVER_CA=
WORKER_GATEWAY_VAULT_TIMEOUT_SECONDS=15
# shadow creates non-runnable phase plans; active performs the explicit
# PostgreSQL-fenced cutover and requires outbound Worker Gateway mode.
PHASE_EXECUTOR_MODE=shadow
# Comma-separated execution zones reachable by this replica. When
# EXECUTOR_CAPABILITIES is empty, exact provider/profile/image/arch/mode labels
# are derived from the reviewed catalog only for these zones.
EXECUTOR_ZONES=default
# Optional exact label override for a specialized replica. Requirements are
# all-of matched in PostgreSQL; there is no architecture/profile/image fallback.
EXECUTOR_CAPABILITIES=
# Required only for SERVER_RUNTIME_ROLE=executor. The actuator allocates this
# UUID before provisioning and every registered slot advertises it.
EXECUTOR_CAPACITY_INSTANCE_ID=
WORKER_CERTIFICATE_TTL_MINUTES=180
# Shared PostgreSQL global and catalog capacity-pool recommendations. "observe"
# evaluates exact pool demand and cooldowns but never creates/deletes VMs.
# "actuate" only enqueues fenced one-slot actions for the separate actuator;
# scheduler transactions still never call a provider. "off" records no action.
SCHEDULER_AUTOSCALE_MODE=observe
SCHEDULER_AUTOSCALE_MIN_SLOTS=1
SCHEDULER_AUTOSCALE_MAX_SLOTS=64
SCHEDULER_AUTOSCALE_TARGET_READY_PER_SLOT=2
SCHEDULER_AUTOSCALE_COOLDOWN_SECONDS=60
SCHEDULER_AUTOSCALE_SCALE_DOWN_SECONDS=600
SCHEDULER_AUTOSCALE_INTERVAL_SECONDS=15
# Required in actuate mode; deployment-wide maximum per provider.
SCHEDULER_AUTOSCALE_PROVIDER_MAX_SLOTS=

# ===== Metrics =====
# METRICS_ENABLED=true exposes Prometheus metrics at GET /metrics on the main
# port (see deploy/prometheus/prometheus-portage.yml for a scrape job).
METRICS_ENABLED=false
# METRICS_PASSWORD=your-secure-password-here
