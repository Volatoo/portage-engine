# Portage Engine Builder Configuration

# Builder server port
BUILDER_PORT=9090

# Shared secret required on the build/job endpoints. Must equal the server's
# BUILDER_TOKEN. Leave empty ONLY for isolated local testing — an empty token
# leaves the build endpoint unauthenticated, and builds run code as root.
# Generate with: openssl rand -hex 32
BUILDER_TOKEN=

# Preferred disposable-worker mode. In pull mode the builder opens no inbound
# 9090 listener and ignores BUILDER_TOKEN; all paths below are provisioned for
# one scheduler attempt by the control plane.
WORKER_PULL_ENABLED=false
WORKER_GATEWAY_URL=
WORKER_TLS_CERT=
WORKER_TLS_KEY=
WORKER_TLS_CA=

# Number of concurrent build workers
BUILDER_WORKERS=2

# The builder must run inside a native Gentoo disposable VM/root. Legacy
# USE_DOCKER=true configurations are rejected at startup.

# Native builds mutate the root even with --oneshot. single-use atomically
# accepts one BuildJob, persists a taint marker, and then
# refuses further builds until an EXTERNAL VM/snapshot/rootfs reset removes all
# job state. Never delete only the marker on a dirty host. unsafe-reuse exists
# solely for disposable development and is not suitable for community Infra.
NATIVE_JOB_POLICY=single-use

# Working directories
BUILD_WORK_DIR=/var/tmp/portage-builds
BUILD_ARTIFACT_DIR=/var/tmp/portage-artifacts

# Persistence configuration
DATA_DIR=/var/lib/portage-engine
PERSISTENCE_ENABLED=true
RETENTION_DAYS=7

# ===== Portage Mirror Settings =====
# Mirror URL for portage tree sync (rsync or git)
# Example: rsync://rsync.gentoo.org/gentoo-portage
# Example: https://github.com/gentoo-mirror/gentoo.git
SYNC_MIRROR=

# Mirror URL for distfiles download
# Example: https://distfiles.gentoo.org
# Example: https://mirrors.aliyun.com/gentoo
DISTFILES_MIRROR=

# ===== Native Gentoo Portage Paths =====
# Path to portage repos directory in the disposable root
PORTAGE_REPOS_PATH=/var/db/repos

# Path to portage configuration directory in the disposable root
PORTAGE_CONF_PATH=/etc/portage

# Path to make.conf in the disposable root
MAKE_CONF_PATH=/etc/portage/make.conf

# Binary package format: "gpkg" (modern and required for isolated signing) or
# "xpak" (legacy .tbz2, being deprecated by Gentoo). Builders always emit
# unsigned packages; portage-signer signs a verified quarantine generation.
BINPKG_FORMAT=gpkg

# Storage configuration
STORAGE_TYPE=local
STORAGE_LOCAL_DIR=/var/binpkgs

# S3-compatible immutable object storage. Credentials use the standard AWS SDK
# chain; environment variables are shown for a static local deployment.
# STORAGE_S3_BUCKET=my-binpkgs
# STORAGE_S3_REGION=us-east-1
# STORAGE_S3_PREFIX=gentoo/releases/amd64/binpackages/23.0/x86-64/
# STORAGE_S3_ENDPOINT=http://minio.internal:9000
# STORAGE_S3_USE_PATH_STYLE=true
# STORAGE_S3_PUBLIC_BASE_URL=https://binpkgs.example.org
# AWS_ACCESS_KEY_ID=your-aws-access-key
# AWS_SECRET_ACCESS_KEY=your-aws-secret-key

# Reserved generic HTTP-storage setting. This backend currently fails fast as
# unimplemented. Dashboard-managed artifact mirror upload is a separate path.
# STORAGE_HTTP_BASE=https://binpkgs.example.com

# Server configuration for artifact upload and registration. The builder may
# receive the release public key for a job-local install-verification keyring;
# it never receives a signing private key.
# SERVER_URL=http://localhost:8080

# Notification configuration file path (optional)
# NOTIFY_CONFIG=/path/to/notification.json

# Metrics configuration
METRICS_ENABLED=false
METRICS_PORT=2112
# METRICS_PASSWORD=your-secure-password-here

# URL of the Portage Engine server (for artifact upload and
# registration/heartbeat). Replace SERVER_HOST with your server's
# hostname or IP. When set, the builder registers itself with the server and
# sends a heartbeat every 30s so it appears in the builder registry.
SERVER_URL=http://SERVER_HOST:8080

# The server's API key, attached to registration/heartbeat calls.
# Required when the server sets API_KEY.
# SERVER_API_KEY=

# URL under which THIS builder is reachable from the server, used for
# registration. Defaults to http://<hostname>:<port>; set explicitly when the
# hostname does not resolve from the server.
# BUILDER_ADVERTISE_URL=http://builder1.lan:9090
