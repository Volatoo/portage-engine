# Portage Engine Dashboard Configuration

# trusted: self-hosted/LAN compatibility. public: require provider-only login,
# Secure cookies, HTTPS callbacks and no legacy backend administrator key.
DEPLOYMENT_MODE=trusted

# Dashboard server port
DASHBOARD_PORT=8081

# Portage Engine server URL.
# Replace SERVER_HOST with your server's hostname or IP.
SERVER_URL=http://SERVER_HOST:8080

# API key the dashboard presents to the backend server (must equal the
# server's API_KEY when the server has authentication enabled).
SERVER_API_KEY=
# Separate server STEP_UP_API_KEY. The dashboard forwards it only after the
# local operator re-enters ADMIN_USER/ADMIN_PASSWORD; it is never sent for
# ordinary requests.
SERVER_STEP_UP_API_KEY=

# Authentication settings.
#
# Authentication ships DISABLED so the dashboard starts out of the box with the
# default config. For any non-local / production deployment you MUST:
#   1. Set AUTH_ENABLED=true
#   2. Set a strong JWT_SECRET (>= 32 chars): openssl rand -hex 32
#   3. Set ADMIN_USER / ADMIN_PASSWORD below (needed when ALLOW_ANONYMOUS=false)
#
# When AUTH_ENABLED=true the dashboard REFUSES to start if JWT_SECRET is empty,
# too short, or a well-known insecure value (e.g. "change-me-in-production").
AUTH_ENABLED=false
# JWT secret for signing tokens. MUST be at least 32 characters when
# AUTH_ENABLED=true. Generate with: openssl rand -hex 32
JWT_SECRET=
ALLOW_ANONYMOUS=false
# Set true whenever users reach the Dashboard over HTTPS, including TLS
# termination at a reverse proxy.
COOKIE_SECURE=false

# Operator login credentials. Required when AUTH_ENABLED=true and
# ALLOW_ANONYMOUS=false; the login endpoint issues a signed JWT only for
# these credentials.
ADMIN_USER=admin
ADMIN_PASSWORD=
# Issued-token lifetime in minutes (default 720 = 12h).
TOKEN_TTL_MINUTES=720

# Preferred multi-provider configuration shared with the control plane; see
# configs/auth-providers.example.json. Upstream tokens are exchanged once for
# a Portage Engine opaque session and are never retained in the browser cookie.
AUTH_PROVIDERS_PATH=
# Legacy single-OIDC compatibility.
OIDC_ENABLED=false
OIDC_ISSUER_URL=
OIDC_CLIENT_ID=
OIDC_CLIENT_SECRET=
OIDC_REDIRECT_URL=http://127.0.0.1:8081/auth/oidc/callback
# Trusted private LAN only; HTTP exposes bearer tokens to network observers.
OIDC_ALLOW_INSECURE_HTTP=false

# Metrics configuration
METRICS_ENABLED=false
METRICS_PORT=2112
# METRICS_PASSWORD=your-secure-password-here
